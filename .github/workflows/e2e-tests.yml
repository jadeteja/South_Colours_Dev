name: Playwright E2E Tests & Allure Report

on:
  push:
    branches: [ main ]
    paths:
      - 'southcolours-automation/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  e2e-tests:
    name: Run Playwright E2E Suite
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: southcolours-automation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: southcolours-automation/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E Automation Tests
        env:
          BASE_URL: https://southcolours.in
          CI: true
        run: npm run test:chromium

      - name: Setup Java for Allure CLI
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o reports/allure-report

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: southcolours-automation/reports/allure-report
          retention-days: 14

      - name: Upload Traces & Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: southcolours-automation/test-results/artifacts
          retention-days: 7
